services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    restart: unless-stopped
    init: true
    env_file: .env.worker
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    volumes:
      - worker_journal:/state
    tmpfs: [/tmp]
    stop_grace_period: 180s
    mem_limit: 512m
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  worker_journal:
